<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>茉莉</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            background: #0f172a;
            font-family: "Microsoft YaHei", sans-serif;

            height: 100vh;

            display: flex;
            flex-direction: column;

            color: white;
        }

        /* 顶部 */

        .header {

            height: 60px;

            background: rgba(15, 23, 42, 0.95);

            border-bottom: 1px solid rgba(255,255,255,0.08);

            display: flex;

            align-items: center;

            padding: 0 24px;

            font-size: 20px;

            font-weight: bold;

            backdrop-filter: blur(10px);
        }

        /* 聊天区域 */

        .chat-container {

            flex: 1;

            overflow-y: auto;

            padding: 30px 20px 120px;

            display: flex;

            flex-direction: column;

            gap: 20px;
        }

        /* 消息 */

        .message {

            display: flex;

            width: 100%;
        }

        .message-content {

            max-width: 75%;

            padding: 14px 18px;

            border-radius: 18px;

            line-height: 1.7;

            font-size: 15px;

            word-break: break-word;

            animation: fadeIn 0.2s ease;
        }

        /* 用户 */

        .user {

            justify-content: flex-end;
        }

        .user .message-content {

            background: linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

            border-bottom-right-radius: 6px;
        }

        /* AI */

        .assistant {

            justify-content: flex-start;
        }

        .assistant .message-content {

            background: #1e293b;

            border-bottom-left-radius: 6px;

            border: 1px solid rgba(255,255,255,0.05);
        }

        /* 输入区域 */

        .input-wrapper {

            position: fixed;

            bottom: 0;

            width: 100%;

            padding: 20px;

            background: linear-gradient(
                to top,
                #0f172a,
                rgba(15, 23, 42, 0.8)
            );

            backdrop-filter: blur(10px);
        }

        .input-container {

            max-width: 1000px;

            margin: auto;

            display: flex;

            gap: 12px;

            background: #1e293b;

            padding: 12px;

            border-radius: 18px;

            border: 1px solid rgba(255,255,255,0.06);
        }

        #messageInput {

            flex: 1;

            background: transparent;

            border: none;

            outline: none;

            color: white;

            font-size: 16px;

            resize: none;
        }

        #messageInput::placeholder {

            color: #94a3b8;
        }

        button {

            border: none;

            background: #2563eb;

            color: white;

            padding: 12px 20px;

            border-radius: 12px;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {

            background: #1d4ed8;
        }

        /* 加载动画 */

        .typing {

            display: flex;

            gap: 6px;
        }

        .typing span {

            width: 8px;

            height: 8px;

            background: #94a3b8;

            border-radius: 50%;

            animation: bounce 1s infinite;
        }

        .typing span:nth-child(2) {

            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {

            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 滚动条 */

        ::-webkit-scrollbar {

            width: 6px;
        }

        ::-webkit-scrollbar-thumb {

            background: rgba(255,255,255,0.1);

            border-radius: 10px;
        }

    </style>

</head>

<body>

    <!-- 顶部 -->

    <div class="header">
        茉莉
    </div>

    <!-- 聊天区域 -->

    <div
        class="chat-container"
        id="chatContainer"
    >

        <div class="message assistant">

            <div class="message-content">
                你好，我是你的本地 AI Agent
            </div>

        </div>

    </div>

    <!-- 输入区域 -->

    <div class="input-wrapper">

        <div class="input-container">

            <input
                id="messageInput"
                type="text"
                placeholder="请输入消息..."
            >

            <button onclick="sendMessage()">
                发送
            </button>

        </div>

    </div>

    <script>

        const chatContainer =
            document.getElementById('chatContainer');

        const messageInput =
            document.getElementById('messageInput');

        // 添加消息

        function addMessage(text, role) {

            const wrapper =
                document.createElement('div');

            wrapper.className =
                `message ${role}`;

            wrapper.innerHTML = `
                <div class="message-content">
                    ${text}
                </div>
            `;

            chatContainer.appendChild(wrapper);

            scrollBottom();
        }

        // 滚动到底部

        function scrollBottom() {

            chatContainer.scrollTop =
                chatContainer.scrollHeight;
        }

        // 加载动画

        function addTyping() {

            const wrapper =
                document.createElement('div');

            wrapper.className =
                'message assistant';

            wrapper.id = 'typing';

            wrapper.innerHTML = `
                <div class="message-content">
                    <div class="typing">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;

            chatContainer.appendChild(wrapper);

            scrollBottom();
        }

        function removeTyping() {

            const typing =
                document.getElementById('typing');

            if (typing) {
                typing.remove();
            }
        }

        // 发送消息

        async function sendMessage() {

            const message =
                messageInput.value.trim();

            if (!message) {
                return;
            }

            // 用户消息

            addMessage(message, 'user');

            messageInput.value = '';

            // 加载动画

            addTyping();

            try {

                const response =
                    await fetch('/chat', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });

                const data =
                    await response.json();

                removeTyping();

                addMessage(
                    data.response,
                    'assistant'
                );

            } catch (error) {

                removeTyping();

                addMessage(
                    '请求失败',
                    'assistant'
                );

                console.error(error);
            }

        }

        // 回车发送

        messageInput.addEventListener(
            'keydown',
            function(e) {

                if (e.key === 'Enter') {
                    sendMessage();
                }

            }
        );

    </script>

</body>
</html>
