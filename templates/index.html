<!DOCTYPE html>
<html lang="zh">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>茉莉 AI Agent</title>

    <!-- Markdown -->

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- 代码高亮 -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>

    <style>

        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            background: #0f172a;

            font-family: "Microsoft YaHei", sans-serif;

            height: 100vh;

            display: flex;

            flex-direction: column;

            color: white;

            overflow: hidden;
        }

        /* =====================================================
           Header
        ===================================================== */

        .header {

            height: 60px;

            background: rgba(15, 23, 42, 0.95);

            border-bottom: 1px solid rgba(255,255,255,0.08);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 24px;

            backdrop-filter: blur(10px);

            flex-shrink: 0;
        }

        .logo {

            font-size: 20px;

            font-weight: bold;
        }

        .session {

            font-size: 12px;

            color: #94a3b8;
        }

        /* =====================================================
           Chat
        ===================================================== */

        .chat-container {

            flex: 1;

            overflow-y: auto;

            padding: 30px 20px 120px;

            display: flex;

            flex-direction: column;

            gap: 20px;
        }

        /* =====================================================
           Message
        ===================================================== */

        .message {

            display: flex;

            width: 100%;
        }

        .message-content {

            max-width: 75%;

            padding: 14px 18px;

            border-radius: 18px;

            line-height: 1.8;

            font-size: 15px;

            word-break: break-word;

            animation: fadeIn 0.2s ease;

            overflow-x: auto;
        }

        /* User */

        .user {

            justify-content: flex-end;
        }

        .user .message-content {

            background: linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

            border-bottom-right-radius: 6px;
        }

        /* Assistant */

        .assistant {

            justify-content: flex-start;
        }

        .assistant .message-content {

            background: #1e293b;

            border-bottom-left-radius: 6px;

            border: 1px solid rgba(255,255,255,0.05);
        }

        /* =====================================================
           Markdown
        ===================================================== */

        .message-content h1,
        .message-content h2,
        .message-content h3 {

            margin-top: 12px;
            margin-bottom: 10px;
        }

        .message-content p {

            margin: 8px 0;
        }

        .message-content ul,
        .message-content ol {

            padding-left: 20px;

            margin: 10px 0;
        }

        .message-content li {

            margin-bottom: 6px;
        }

        .message-content pre {

            background: #0f172a;

            border-radius: 12px;

            padding: 14px;

            overflow-x: auto;

            margin-top: 12px;

            margin-bottom: 12px;
        }

        .message-content code {

            font-family: Consolas, monospace;
        }

        .message-content p code,
        .message-content li code {

            background: rgba(255,255,255,0.1);

            padding: 2px 6px;

            border-radius: 6px;
        }

        /* =====================================================
           Input
        ===================================================== */

        .input-wrapper {

            position: fixed;

            bottom: 0;

            width: 100%;

            padding: 20px;

            background: linear-gradient(
                to top,
                #0f172a,
                rgba(15, 23, 42, 0.8)
            );

            backdrop-filter: blur(10px);
        }

        .input-container {

            max-width: 1000px;

            margin: auto;

            display: flex;

            gap: 12px;

            background: #1e293b;

            padding: 12px;

            border-radius: 18px;

            border: 1px solid rgba(255,255,255,0.06);
        }

        #messageInput {

            flex: 1;

            background: transparent;

            border: none;

            outline: none;

            color: white;

            font-size: 16px;
        }

        #messageInput::placeholder {

            color: #94a3b8;
        }

        button {

            border: none;

            background: #2563eb;

            color: white;

            padding: 12px 20px;

            border-radius: 12px;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {

            background: #1d4ed8;
        }

        /* =====================================================
           Typing
        ===================================================== */

        .typing {

            display: flex;

            gap: 6px;
        }

        .typing span {

            width: 8px;

            height: 8px;

            background: #94a3b8;

            border-radius: 50%;

            animation: bounce 1s infinite;
        }

        .typing span:nth-child(2) {

            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {

            animation-delay: 0.4s;
        }

        /* =====================================================
           Scrollbar
        ===================================================== */

        ::-webkit-scrollbar {

            width: 6px;
        }

        ::-webkit-scrollbar-thumb {

            background: rgba(255,255,255,0.1);

            border-radius: 10px;
        }

        /* =====================================================
           Animation
        ===================================================== */

        @keyframes bounce {

            0%, 80%, 100% {

                transform: scale(0.8);

                opacity: 0.5;
            }

            40% {

                transform: scale(1.2);

                opacity: 1;
            }
        }

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform: translateY(5px);
            }

            to {

                opacity: 1;

                transform: translateY(0);
            }
        }

    </style>

</head>

<body>

    <!-- =====================================================
         Header
    ====================================================== -->

    <div class="header">

        <div class="logo">
            茉莉 AI Agent
        </div>

        <div
            class="session"
            id="sessionText"
        ></div>

    </div>

    <!-- =====================================================
         Chat
    ====================================================== -->

    <div
        class="chat-container"
        id="chatContainer"
    >

        <div class="message assistant">

            <div class="message-content">
                你好，我是你的本地 AI Agent 👋
            </div>

        </div>

    </div>

    <!-- =====================================================
         Input
    ====================================================== -->

    <div class="input-wrapper">

        <div class="input-container">

            <input
                id="messageInput"
                type="text"
                placeholder="请输入消息..."
            >

            <button onclick="sendMessage()">
                发送
            </button>

        </div>

    </div>

    <script>

        // =====================================================
        // Session ID
        // =====================================================

        let sessionId =
            localStorage.getItem('session_id');

        if (!sessionId) {

            sessionId =
                crypto.randomUUID();

            localStorage.setItem(
                'session_id',
                sessionId
            );
        }

        document.getElementById(
            'sessionText'
        ).innerText =
            `Session: ${sessionId.slice(0, 8)}`;

        // =====================================================
        // DOM
        // =====================================================

        const chatContainer =
            document.getElementById('chatContainer');

        const messageInput =
            document.getElementById('messageInput');

        // =====================================================
        // Markdown Config
        // =====================================================

        marked.setOptions({

            breaks: true,

            highlight: function(code, lang) {

                if (
                    lang &&
                    hljs.getLanguage(lang)
                ) {

                    return hljs.highlight(
                        code,
                        { language: lang }
                    ).value;
                }

                return hljs.highlightAuto(code)
                    .value;
            }
        });

        // =====================================================
        // Add Message
        // =====================================================

        function addMessage(text, role) {

            const wrapper =
                document.createElement('div');

            wrapper.className =
                `message ${role}`;

            const html =
                marked.parse(text);

            wrapper.innerHTML = `
                <div class="message-content">
                    ${html}
                </div>
            `;

            chatContainer.appendChild(wrapper);

            // 高亮代码

            wrapper.querySelectorAll('pre code')
                .forEach((block) => {

                    hljs.highlightElement(block);

                });

            scrollBottom();
        }

        // =====================================================
        // Scroll Bottom
        // =====================================================

        function scrollBottom() {

            chatContainer.scrollTop =
                chatContainer.scrollHeight;
        }

        // =====================================================
        // Typing
        // =====================================================

        function addTyping() {

            const wrapper =
                document.createElement('div');

            wrapper.className =
                'message assistant';

            wrapper.id = 'typing';

            wrapper.innerHTML = `
                <div class="message-content">
                    <div class="typing">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;

            chatContainer.appendChild(wrapper);

            scrollBottom();
        }

        function removeTyping() {

            const typing =
                document.getElementById('typing');

            if (typing) {

                typing.remove();
            }
        }

        // =====================================================
        // Send Message
        // =====================================================

        async function sendMessage() {

            const message =
                messageInput.value.trim();

            if (!message) {
                return;
            }

            // 用户消息

            addMessage(message, 'user');

            messageInput.value = '';

            // loading

            addTyping();

            try {

                const response =
                    await fetch('/chat', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({

                        message: message,

                        session_id: sessionId

                    })

                });

                const data =
                    await response.json();

                removeTyping();

                addMessage(
                    data.response,
                    'assistant'
                );

                // 对话结束

                if (data.end_conversation) {

                    messageInput.disabled = true;
                }

            } catch (error) {

                removeTyping();

                addMessage(
                    '请求失败，请检查后端服务',
                    'assistant'
                );

                console.error(error);
            }
        }

        // =====================================================
        // Enter Send
        // =====================================================

        messageInput.addEventListener(
            'keydown',
            function(e) {

                if (e.key === 'Enter') {

                    sendMessage();
                }

            }
        );

    </script>

</body>

</html>
