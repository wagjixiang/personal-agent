version: '3.8'

services:
  # ============================================================
  # 主应用服务
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-agent-app
    ports:
      - "${FLASK_PORT:-5000}:5000"
    environment:
      # 基础配置
      ENV: production
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: "False"
      LOG_LEVEL: INFO
      
      # LLM 配置
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GPT_MODEL: ${GPT_MODEL:-qwen-plus}
      MODEL_URL: ${MODEL_URL}
      
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_POOL_SIZE: 20
      DB_MAX_OVERFLOW: 30
      
      # Redis 缓存
      REDIS_ENABLED: "True"
      REDIS_URL: redis://redis:6379/0
      CACHE_TYPE: redis
      CACHE_TTL_DEFAULT: 3600
      QUERY_CACHE_TTL: 3600
      PLAN_CACHE_TTL: 86400
      
      # 查询优化
      QUERY_RESULT_CACHE_ENABLED: "True"
      QUERY_PLAN_CACHE_ENABLED: "True"
      SLOW_QUERY_THRESHOLD_MS: 1000
      
      # 安全配置
      ENABLE_AUTH: "False"
      RATE_LIMIT_ENABLED: "False"
      CORS_ENABLED: "True"
      
      # 监控
      ENABLE_METRICS: "True"
      ENABLE_TRACING: "True"
    
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================
  # MySQL 数据库
  # ============================================================
  mysql:
    image: mysql:8.0-debian
    container_name: personal-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      TZ: Asia/Shanghai
    
    ports:
      - "3306:3306"
    
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/index_optimizer.py:/docker-entrypoint-initdb.d/00-init.sql
    
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --log-bin=mysql-bin
      --binlog-format=ROW
      --max_connections=1000
      --max_allowed_packet=512M
    
    networks:
      - app-network
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis 缓存
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: personal-agent-redis
    ports:
      - "6379:6379"
    
    volumes:
      - redis_data:/data
    
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    
    networks:
      - app-network
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Prometheus 监控
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: personal-agent-prometheus
    ports:
      - "9090:9090"
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    
    networks:
      - app-network
    
    depends_on:
      - app

  # ============================================================
  # Grafana 仪表板
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: personal-agent-grafana
    ports:
      - "3000:3000"
    
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "False"
      GF_SERVER_ROOT_URL: http://localhost:3000
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    
    networks:
      - app-network
    
    depends_on:
      - prometheus

  # ============================================================
  # Jaeger 分布式追踪
  # ============================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: personal-agent-jaeger
    ports:
      - "6831:6831/udp"
      - "16686:16686"
    
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    
    networks:
      - app-network

# ============================================================
# 网络定义
# ============================================================
networks:
  app-network:
    driver: bridge

# ============================================================
# 数据卷定义
# ============================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
